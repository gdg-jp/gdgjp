AgentLsEntry:
  type: object
  required: [name, path, readable, hasChildren]
  properties:
    name:
      type: string
    path:
      type: string
      description: Absolute workspace path.
    readable:
      type: boolean
    hasChildren:
      oneOf:
        - type: boolean
        - type: string
          enum: [unknown]
    title:
      type: string
AgentLsResult:
  type: object
  required: [path, entries, nextCursor, truncated]
  properties:
    path:
      type: string
    entries:
      type: array
      items:
        $ref: '#/AgentLsEntry'
    nextCursor:
      type: string
      nullable: true
    truncated:
      type: boolean
AgentCatResult:
  type: object
  required: [path, content, nextCursor, truncated]
  properties:
    path:
      type: string
    content:
      type: string
    nextCursor:
      type: string
      nullable: true
    truncated:
      type: boolean
AgentSearchMatch:
  type: object
  required: [path, title]
  properties:
    path:
      type: string
    title:
      type: string
    snippet:
      type: string
AgentSearchResult:
  type: object
  required: [matches, nextCursor, truncated]
  properties:
    matches:
      type: array
      items:
        $ref: '#/AgentSearchMatch'
    nextCursor:
      type: string
      nullable: true
    truncated:
      type: boolean
AgentCreateSourceRequest:
  type: object
  required: [url, visibility]
  properties:
    url:
      type: string
      format: uri
    visibility:
      type: string
      enum: [private, member, organizer, chapter-member, chapter-organizer]
    chapter:
      type: string
      description: Chapter id when visibility is chapter-member or chapter-organizer.
    refreshPolicy:
      type: string
      enum: [manual, daily, weekly]
AgentSource:
  type: object
  required: [id, kind, url, title, chapterId, visibility, status, refreshPolicy]
  properties:
    id:
      type: string
    kind:
      type: string
    url:
      type: string
    title:
      type: string
    chapterId:
      type: string
      nullable: true
    visibility:
      type: string
      enum: [private, member, organizer, chapter-member, chapter-organizer]
    status:
      type: string
      enum: [pending]
    refreshPolicy:
      type: string
      enum: [manual, daily, weekly]
AgentCreateNoteRequest:
  type: object
  additionalProperties: false
  required: [slug, title, summary, content, citedPaths]
  properties:
    slug:
      type: string
      maxLength: 160
      pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
    title:
      type: string
      maxLength: 200
    summary:
      type: string
      maxLength: 300
    content:
      type: string
      maxLength: 8000
    citedPaths:
      type: array
      minItems: 2
      maxItems: 12
      items:
        type: string
    replaceId:
      type: string
AgentNote:
  type: object
  required: [id, slug, path, pageUrl, created]
  properties:
    id:
      type: string
    slug:
      type: string
    path:
      type: string
    pageUrl:
      type: string
      format: uri
    created:
      type: boolean
AgentLogRequest:
  type: object
  required: [subject, lines]
  properties:
    subject:
      type: string
      maxLength: 200
    lines:
      type: array
      minItems: 1
      maxItems: 8
      items:
        type: string
        maxLength: 200
AgentInstructionsSlice:
  type: object
  required: [profile, content, contentHash]
  properties:
    profile:
      type: string
      enum: [query]
    content:
      type: string
    contentHash:
      type: string
