Source:
  type: object
  required: [title]
  properties:
    id: { type: string }
    url: { type: string }
    title: { type: string }
    sourceId: { type: string, nullable: true }
Language:
  type: object
  required: [title, summary, translationStatus, content]
  properties:
    title: { type: string }
    summary: { type: string }
    translationStatus: { type: string, enum: [human, ai, missing] }
    content: { type: string }
AccessEntry:
  type: object
  required: [subjectType, subjectKey, subjectLabel, role]
  properties:
    id: { type: string }
    subjectType: { type: string, enum: [email, chapter] }
    subjectKey: { type: string, minLength: 1 }
    subjectLabel: { type: string }
    role: { type: string, enum: [viewer, commenter, editor] }
Attachment:
  type: object
  required: [fileName, mimeType]
  properties:
    id: { type: string }
    r2Key: { type: string }
    fileName: { type: string, minLength: 1 }
    mimeType: { type: string, minLength: 1 }
    downloadUrl: { type: string }
PageMeta:
  type: object
  required: [pageType, pageMetadata, visibility, generalRole, chapterId, tags, access, sources, attachments]
  properties:
    pageType: { type: string, nullable: true }
    pageMetadata: { type: object, additionalProperties: true, nullable: true }
    visibility: { type: string, enum: [restricted, unlisted, public] }
    generalRole: { type: string, enum: [viewer, commenter, editor] }
    chapterId: { type: string, nullable: true }
    tags:
      type: array
      items: { type: string, minLength: 1 }
    access:
      type: array
      items: { $ref: '#/AccessEntry' }
    sources:
      type: array
      items: { $ref: '#/Source' }
    attachments:
      type: array
      items: { $ref: '#/Attachment' }
Page:
  type: object
  required: [slug, parentId, sortOrder, meta]
  properties:
    id:
      type: string
      minLength: 1
      maxLength: 128
      description: Client-stable ID for updates or for referencing a new page within the same atomic sync.
    slug:
      type: string
      minLength: 1
      maxLength: 160
      pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
    parentId: { type: string, nullable: true }
    sortOrder: { type: integer, minimum: 0 }
    revision: { type: integer, minimum: 1 }
    ja: { $ref: '#/Language' }
    en: { $ref: '#/Language' }
    meta: { $ref: '#/PageMeta' }
SnapshotPage:
  allOf:
    - $ref: '#/Page'
    - type: object
      required: [id, revision, pageType, pageMetadata, visibility, generalRole, chapterId, tags, access, sources, attachments]
      properties:
        id: { type: string }
        revision: { type: integer, minimum: 1 }
        pageType: { type: string, nullable: true }
        pageMetadata: { type: object, additionalProperties: true, nullable: true }
        visibility: { type: string, enum: [restricted, unlisted, public] }
        generalRole: { type: string, enum: [viewer, commenter, editor] }
        chapterId: { type: string, nullable: true }
        tags: { type: array, items: { type: string } }
        access: { type: array, items: { $ref: '#/AccessEntry' } }
        sources: { type: array, items: { $ref: '#/Source' } }
        attachments: { type: array, items: { $ref: '#/Attachment' } }
Snapshot:
  type: object
  required: [version, pages, agentsMd]
  properties:
    version: { type: integer, enum: [1] }
    pages:
      type: array
      items: { $ref: '#/SnapshotPage' }
    agentsMd:
      $ref: '#/AgentInstructions'
AgentInstructions:
  type: object
  required: [content, contentHash]
  properties:
    content: { type: string }
    contentHash: { type: string, pattern: '^[a-f0-9]{64}$' }
AgentInstructionsUpdate:
  type: object
  required: [content, expectedContentHash]
  properties:
    content: { type: string, minLength: 1, maxLength: 262144 }
    expectedContentHash: { type: string, pattern: '^[a-f0-9]{64}$' }
UpsertOperation:
  type: object
  required: [kind, page]
  properties:
    kind: { type: string, enum: [upsert] }
    expectedRevision: { type: integer, minimum: 1 }
    page: { $ref: '#/Page' }
ArchiveOperation:
  type: object
  required: [kind, id, expectedRevision]
  properties:
    kind: { type: string, enum: [archive] }
    id: { type: string }
    expectedRevision: { type: integer, minimum: 1 }
SyncRequest:
  type: object
  properties:
    operations:
      type: array
      minItems: 1
      items:
        oneOf:
          - $ref: '#/UpsertOperation'
          - $ref: '#/ArchiveOperation'
        discriminator:
          propertyName: kind
          mapping:
            upsert: '#/UpsertOperation'
            archive: '#/ArchiveOperation'
    agentsMd:
      $ref: '#/AgentInstructionsUpdate'
SyncResultPage:
  type: object
  required: [id, slug, attachmentIds]
  properties:
    id: { type: string }
    slug: { type: string }
    revision: { type: integer, minimum: 1 }
    attachmentIds:
      type: object
      additionalProperties: { type: string }
SyncResult:
  type: object
  required: [ok, pages]
  properties:
    ok: { type: boolean, enum: [true] }
    pages:
      type: array
      items: { $ref: '#/SyncResultPage' }
SourcesManifestEntry:
  type: object
  required: [documentId, kind, title, path, contentHash]
  properties:
    documentId: { type: string }
    sourceId: { type: string, nullable: true }
    kind: { type: string, enum: [source-document, source-asset, wiki-human] }
    title: { type: string }
    path: { type: string }
    contentHash: { type: string }
    mediaType: { type: string }
    capturedAt: { type: integer, nullable: true }
    ingestedHash: { type: string, nullable: true }
SourcesManifest:
  type: object
  required: [version, documents]
  properties:
    version: { type: integer, enum: [1] }
    documents:
      type: array
      items: { $ref: '#/SourcesManifestEntry' }
IngestedRequest:
  type: object
  required: [documents]
  properties:
    documents:
      type: array
      minItems: 1
      items:
        type: object
        required: [documentId, contentHash]
        properties:
          documentId: { type: string }
          contentHash: { type: string }
IngestedResult:
  type: object
  required: [ok]
  properties:
    ok: { type: boolean, enum: [true] }
