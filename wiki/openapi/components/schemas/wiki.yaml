Language:
  type: object
  required: [title, summary, translationStatus, content]
  properties:
    title: { type: string }
    summary: { type: string }
    translationStatus: { type: string, enum: [human, ai, missing] }
    content: { type: string }
AccessEntry:
  type: object
  required: [subjectType, subjectKey, subjectLabel, role]
  properties:
    id: { type: string }
    subjectType: { type: string, enum: [email, chapter] }
    subjectKey: { type: string, minLength: 1 }
    subjectLabel: { type: string }
    role: { type: string, enum: [viewer, commenter, editor] }
Source:
  type: object
  required: [url, title]
  properties:
    id: { type: string }
    url: { type: string, format: uri }
    title: { type: string }
Attachment:
  type: object
  required: [fileName, mimeType]
  properties:
    id: { type: string }
    r2Key: { type: string }
    fileName: { type: string, minLength: 1 }
    mimeType: { type: string, minLength: 1 }
    downloadUrl: { type: string }
PageMeta:
  type: object
  required: [status, pageType, pageMetadata, visibility, generalRole, chapterId, tags, access, sources, attachments]
  properties:
    status: { type: string, enum: [draft, published] }
    pageType: { type: string, nullable: true }
    pageMetadata: { type: object, additionalProperties: true, nullable: true }
    visibility: { type: string, enum: [restricted, unlisted, public] }
    generalRole: { type: string, enum: [viewer, commenter, editor] }
    chapterId: { type: string, nullable: true }
    tags:
      type: array
      items: { type: string, minLength: 1 }
    access:
      type: array
      items: { $ref: '#/AccessEntry' }
    sources:
      type: array
      items: { $ref: '#/Source' }
    attachments:
      type: array
      items: { $ref: '#/Attachment' }
Page:
  type: object
  required: [slug, parentId, sortOrder, ja, en, meta]
  properties:
    id: { type: string }
    slug:
      type: string
      minLength: 1
      maxLength: 160
      pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
    parentId: { type: string, nullable: true }
    sortOrder: { type: integer, minimum: 0 }
    revision: { type: integer, minimum: 1 }
    ja: { $ref: '#/Language' }
    en: { $ref: '#/Language' }
    meta: { $ref: '#/PageMeta' }
SnapshotPage:
  allOf:
    - $ref: '#/Page'
    - type: object
      required: [id, revision, status, pageType, pageMetadata, visibility, generalRole, chapterId, tags, access, sources, attachments]
      properties:
        id: { type: string }
        revision: { type: integer, minimum: 1 }
        status: { type: string, enum: [draft, published] }
        pageType: { type: string, nullable: true }
        pageMetadata: { type: object, additionalProperties: true, nullable: true }
        visibility: { type: string, enum: [restricted, unlisted, public] }
        generalRole: { type: string, enum: [viewer, commenter, editor] }
        chapterId: { type: string, nullable: true }
        tags: { type: array, items: { type: string } }
        access: { type: array, items: { $ref: '#/AccessEntry' } }
        sources: { type: array, items: { $ref: '#/Source' } }
        attachments: { type: array, items: { $ref: '#/Attachment' } }
Snapshot:
  type: object
  required: [version, pages]
  properties:
    version: { type: integer, enum: [1] }
    pages:
      type: array
      items: { $ref: '#/SnapshotPage' }
UpsertOperation:
  type: object
  required: [kind, page]
  properties:
    kind: { type: string, enum: [upsert] }
    expectedRevision: { type: integer, minimum: 1 }
    page: { $ref: '#/Page' }
ArchiveOperation:
  type: object
  required: [kind, id, expectedRevision]
  properties:
    kind: { type: string, enum: [archive] }
    id: { type: string }
    expectedRevision: { type: integer, minimum: 1 }
SyncRequest:
  type: object
  required: [operations]
  properties:
    operations:
      type: array
      minItems: 1
      items:
        oneOf:
          - $ref: '#/UpsertOperation'
          - $ref: '#/ArchiveOperation'
        discriminator:
          propertyName: kind
          mapping:
            upsert: '#/UpsertOperation'
            archive: '#/ArchiveOperation'
SyncResultPage:
  type: object
  required: [id, slug, attachmentIds]
  properties:
    id: { type: string }
    slug: { type: string }
    revision: { type: integer, minimum: 1 }
    attachmentIds:
      type: object
      additionalProperties: { type: string }
SyncResult:
  type: object
  required: [ok, pages]
  properties:
    ok: { type: boolean, enum: [true] }
    pages:
      type: array
      items: { $ref: '#/SyncResultPage' }
