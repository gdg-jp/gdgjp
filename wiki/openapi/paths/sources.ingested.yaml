post:
  operationId: markWikiSourcesIngested
  summary: Record that source documents have been ingested
  security:
    - BearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/wiki.yaml#/IngestedRequest
  responses:
    '200':
      description: Ingestion hashes recorded.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/wiki.yaml#/IngestedResult
    '400':
      $ref: ../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../components/responses/common.yaml#/Unauthorized
