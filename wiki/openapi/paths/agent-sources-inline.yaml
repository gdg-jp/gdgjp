post:
  operationId: agentCreateInlineSource
  summary: Register an inline conversation log as a raw source
  security:
    - BearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/agent.yaml#/InlineSourceRequest
  responses:
    '201':
      description: Inline source persisted and ready.
      content:
        application/json:
          schema:
            type: object
            required: [id, kind, visibility, chapterId, title, createdAt]
            properties:
              id: { type: string }
              kind: { type: string, enum: [conversation] }
              visibility:
                type: string
                enum: [private, member, organizer, chapter-member, chapter-organizer]
              chapterId: { type: string, nullable: true }
              title: { type: string }
              createdAt: { type: string, format: date-time }
    '400':
      $ref: ../components/responses/common.yaml#/BadRequest
    '401':
      $ref: ../components/responses/common.yaml#/Unauthorized
    '403':
      $ref: ../components/responses/common.yaml#/Forbidden
    '413':
      description: Inline content exceeds the one million UTF-8 byte limit.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string, enum: [content_too_large] }
    '409':
      description: Idempotency key conflict.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string, enum: [conflict] }
    '503':
      description: Source storage unavailable while persisting the inline source.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string, enum: [persist_failed] }
