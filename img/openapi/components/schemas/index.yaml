ImageId:
  type: object
  required: [id]
  properties:
    id:
      type: string
      pattern: '^[0-9A-Za-z]{8}$'
      minLength: 8
      maxLength: 8
UploadResult:
  type: object
  required: [id, url]
  properties:
    id: { type: string, pattern: '^[0-9A-Za-z]{8}$', minLength: 8, maxLength: 8 }
    url: { type: string, format: uri }
InternalUploadUser:
  type: object
  required: [id, email, name, image, isAdmin]
  properties:
    id: { type: string, minLength: 1 }
    email: { type: string, format: email, minLength: 1 }
    name: { type: string, minLength: 1 }
    image: { type: string, format: uri, nullable: true }
    isAdmin: { type: boolean }
Success:
  type: object
  required: [ok]
  properties:
    ok: { type: boolean, enum: [true] }
