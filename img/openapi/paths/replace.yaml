post:
  operationId: replaceImage
  security: [{ cookieAuth: [] }]
  parameters: [{ $ref: ../components/parameters/index.yaml#/ImageIdPath }]
  requestBody:
    required: true
    content: { multipart/form-data: { schema: { type: object, required: [file], properties: { file: { type: string, format: binary, maxLength: 10485760 } } } } }
  responses:
    '200': { description: Image replaced, content: { application/json: { schema: { $ref: ../components/schemas/index.yaml#/ImageId } } } }
    '403': { $ref: ../components/responses/index.yaml#/Forbidden }
    '404': { $ref: ../components/responses/index.yaml#/NotFound }
