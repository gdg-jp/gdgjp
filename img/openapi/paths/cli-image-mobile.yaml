post:
  operationId: uploadCliMobileImage
  security: [{ BearerAuth: [] }]
  parameters: [{ $ref: ../components/parameters/index.yaml#/ImageId }]
  requestBody:
    required: true
    content: { multipart/form-data: { schema: { type: object, required: [file], properties: { file: { type: string, format: binary, maxLength: 10485760 } } } } }
  responses:
    '200': { description: Mobile image uploaded, content: { application/json: { schema: { $ref: ../components/schemas/index.yaml#/CliMobileResult } } } }
    '400': { $ref: ../components/responses/index.yaml#/CliBadRequest }
    '413': { $ref: ../components/responses/index.yaml#/CliTooLarge }
    '401': { $ref: ../components/responses/index.yaml#/CliUnauthorized }
    '403': { $ref: ../components/responses/index.yaml#/CliForbidden }
    '404': { $ref: ../components/responses/index.yaml#/CliNotFound }
