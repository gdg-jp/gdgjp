get:
  operationId: getCliImage
  security: [{ BearerAuth: [] }]
  parameters: [{ $ref: ../components/parameters/index.yaml#/ImageIdPath }]
  responses:
    '200': { description: Image management metadata, content: { application/json: { schema: { $ref: ../components/schemas/index.yaml#/CliImageResponse } } } }
    '401': { $ref: ../components/responses/index.yaml#/CliUnauthorized }
    '403': { $ref: ../components/responses/index.yaml#/CliForbidden }
    '404': { $ref: ../components/responses/index.yaml#/CliNotFound }
put:
  operationId: replaceCliImage
  security: [{ BearerAuth: [] }]
  parameters: [{ $ref: ../components/parameters/index.yaml#/ImageIdPath }]
  requestBody:
    required: true
    content: { multipart/form-data: { schema: { type: object, required: [file], properties: { file: { type: string, format: binary, maxLength: 10485760 } } } } }
  responses:
    '200': { description: Image replaced, content: { application/json: { schema: { $ref: ../components/schemas/index.yaml#/CliReplaceResult } } } }
    '400': { $ref: ../components/responses/index.yaml#/CliBadRequest }
    '413': { $ref: ../components/responses/index.yaml#/CliTooLarge }
    '401': { $ref: ../components/responses/index.yaml#/CliUnauthorized }
    '403': { $ref: ../components/responses/index.yaml#/CliForbidden }
    '404': { $ref: ../components/responses/index.yaml#/CliNotFound }
delete:
  operationId: deleteCliImage
  security: [{ BearerAuth: [] }]
  parameters: [{ $ref: ../components/parameters/index.yaml#/ImageIdPath }]
  responses:
    '200': { description: Image deleted, content: { application/json: { schema: { $ref: ../components/schemas/index.yaml#/CliDeleteResult } } } }
    '401': { $ref: ../components/responses/index.yaml#/CliUnauthorized }
    '403': { $ref: ../components/responses/index.yaml#/CliForbidden }
    '404': { $ref: ../components/responses/index.yaml#/CliNotFound }
