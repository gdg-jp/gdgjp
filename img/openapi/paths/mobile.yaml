post:
  operationId: uploadMobileImage
  security: [{ cookieAuth: [] }]
  parameters: [{ $ref: ../components/parameters/index.yaml#/ImageId }]
  requestBody:
    required: true
    content: { multipart/form-data: { schema: { type: object, required: [file], properties: { file: { type: string, format: binary, maxLength: 10485760 } } } } }
  responses:
    '200': { description: Mobile image uploaded, content: { application/json: { schema: { $ref: ../components/schemas/index.yaml#/ImageId } } } }
delete:
  operationId: deleteMobileImage
  security: [{ cookieAuth: [] }]
  parameters: [{ $ref: ../components/parameters/index.yaml#/ImageId }]
  responses:
    '200': { description: Mobile image removed, content: { application/json: { schema: { $ref: ../components/schemas/index.yaml#/Success } } } }
