name = "gdgjp-pay"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
main = "./workers/app.ts"

[alias]
"virtual:react-router/server-build" = "./build/server/index.js"

[vars]
APP_URL = "https://pay.gdgs.jp"
ACCOUNTS_URL = "https://accounts.gdgs.jp"
IDP_URL = "https://accounts.gdgs.jp"
IDP_CLIENT_ID = "pay"
SHEETS_TEMPLATE_ID = "1aCZQQMId6NoLLYJ8c9hve-BrxIME4NowWfpZXWb9pag"
GEMINI_MODEL_ID = "gemini-3.5-flash-lite"
COMM_SUPPORT_EMAIL = "comm-support@voice-research.com"
EMAIL_FROM = "GDG Japan Pay <noreply@gdgs.jp>"
# Fill in after creating the OAuth client / Picker API key in Google Cloud Console.
GOOGLE_OAUTH_CLIENT_ID = ""
GOOGLE_PICKER_API_KEY = ""

[assets]
binding = "ASSETS"
directory = "./build/client"

[[d1_databases]]
binding = "DB"
database_name = "gdgjp-pay-db"
database_id = "1b87d36f-c80f-482b-9943-5ad63cc02637"
migrations_dir = "./migrations"

[[r2_buckets]]
binding = "RECEIPTS"
bucket_name = "gdgjp-pay-receipts"

[[routes]]
pattern = "pay.gdgs.jp/*"
zone_name = "gdgs.jp"

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 0.1
persist = true

# Set with `wrangler secret put`:
# RP_SESSION_SECRET, IDP_CLIENT_SECRET, TOKEN_ENCRYPTION_KEY,
# GEMINI_API_KEY, GOOGLE_OAUTH_CLIENT_SECRET, RESEND_API_KEY
