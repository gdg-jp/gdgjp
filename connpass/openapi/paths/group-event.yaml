get:
  operationId: getGroupEvent
  summary: Get a single event by scraping the edit page in Browser Run
  security:
    - BearerAuth: []
  parameters:
    - name: groupId
      in: path
      required: true
      schema:
        type: string
    - name: eventId
      in: path
      required: true
      schema:
        type: string
  responses:
    "200":
      description: Event
      content:
        application/json:
          schema:
            type: object
            required: [groupId, event]
            properties:
              groupId:
                type: string
              event:
                $ref: ../components/schemas/index.yaml#/Event
    "401":
      description: Invalid token
      content:
        application/json:
          schema:
            $ref: ../components/schemas/index.yaml#/Error
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: ../components/schemas/index.yaml#/Error
    "404":
      description: Not found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/index.yaml#/Error
patch:
  operationId: updateGroupEvent
  summary: Update event fields on the edit page (async browser job)
  security:
    - BearerAuth: []
  parameters:
    - name: groupId
      in: path
      required: true
      schema:
        type: string
    - name: eventId
      in: path
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/index.yaml#/UpdateEventRequest
  responses:
    "202":
      description: Job accepted
      content:
        application/json:
          schema:
            $ref: ../components/schemas/index.yaml#/Job
    "401":
      description: Invalid token
      content:
        application/json:
          schema:
            $ref: ../components/schemas/index.yaml#/Error
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: ../components/schemas/index.yaml#/Error
