get:
  operationId: listGroupEvents
  summary: List events for an allowlisted group (browser scrape of group event list)
  security:
    - BearerAuth: []
  parameters:
    - name: groupId
      in: path
      required: true
      schema:
        type: string
  responses:
    "200":
      description: Events
      content:
        application/json:
          schema:
            type: object
            required: [groupId, resultsReturned, events]
            properties:
              groupId:
                type: string
              resultsReturned:
                type: integer
              events:
                type: array
                items:
                  $ref: ../components/schemas/index.yaml#/EventSummary
    "401":
      description: Invalid token
      content:
        application/json:
          schema:
            $ref: ../components/schemas/index.yaml#/Error
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: ../components/schemas/index.yaml#/Error
post:
  operationId: createGroupEvent
  summary: Create an event draft (async browser job)
  security:
    - BearerAuth: []
  parameters:
    - name: groupId
      in: path
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/index.yaml#/CreateEventRequest
  responses:
    "202":
      description: Job accepted
      content:
        application/json:
          schema:
            $ref: ../components/schemas/index.yaml#/Job
    "400":
      description: Bad request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/index.yaml#/Error
    "401":
      description: Invalid token
      content:
        application/json:
          schema:
            $ref: ../components/schemas/index.yaml#/Error
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: ../components/schemas/index.yaml#/Error
