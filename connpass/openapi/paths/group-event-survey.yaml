parameters:
  - $ref: ../components/parameters/common.yaml#/GroupId
  - $ref: ../components/parameters/common.yaml#/EventId
get:
  operationId: getGroupEventSurvey
  summary: Get an event's survey
  security:
    - BearerAuth: []
  responses:
    "200":
      description: Survey
      content:
        application/json:
          schema:
            type: object
            required: [groupId, eventId, survey]
            properties:
              groupId:
                type: string
              eventId:
                type: string
              survey:
                $ref: ../components/schemas/index.yaml#/Survey
    "401":
      $ref: ../components/responses/common.yaml#/Unauthorized
    "403":
      $ref: ../components/responses/common.yaml#/Forbidden
    "404":
      $ref: ../components/responses/common.yaml#/NotFound
put:
  operationId: upsertGroupEventSurvey
  summary: Create or replace an event's survey (async browser job)
  description: Replaces the entire question list, matching connpass's survey editor.
  security:
    - BearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/index.yaml#/UpsertSurveyRequest
  responses:
    "202":
      description: Job accepted
      content:
        application/json:
          schema:
            $ref: ../components/schemas/index.yaml#/Job
    "400":
      $ref: ../components/responses/common.yaml#/BadRequest
    "401":
      $ref: ../components/responses/common.yaml#/Unauthorized
    "403":
      $ref: ../components/responses/common.yaml#/Forbidden
    "404":
      $ref: ../components/responses/common.yaml#/NotFound
