get:
  operationId: getCliIdentity
  security: [{ bearerAuth: [] }]
  responses:
    '200':
      description: Identity for a gdg-cli access token carrying the CLI scope.
      content:
        application/json:
          schema: { $ref: ../components/schemas/index.yaml#/CliIdentity }
    '401': { $ref: ../components/responses/index.yaml#/Unauthorized }
