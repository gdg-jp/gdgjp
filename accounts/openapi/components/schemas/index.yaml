Chapter:
  type: object
  required: [id, slug, name, kind]
  properties:
    id: { type: string }
    slug: { type: string, minLength: 1 }
    name: { type: string, minLength: 1 }
    kind: { type: string }
ChapterDirectory:
  type: object
  required: [chapters]
  properties:
    chapters:
      type: array
      items: { $ref: '#/Chapter' }
ErrorResponse:
  type: object
  required: [error]
  properties:
    error: { type: string }
    error_description: { type: string }
OAuthClient:
  type: object
  required: [client_id, client_name, redirect_uris, post_logout_redirect_uris, scope, token_endpoint_auth_method, grant_types, response_types, public, type, disabled, skip_consent, enable_end_session, require_pkce, subject_type]
  properties:
    client_id: { type: string, minLength: 1 }
    client_name: { type: string, minLength: 1 }
    client_uri: { type: string, format: uri, nullable: true }
    redirect_uris:
      type: array
      items: { type: string, format: uri }
    post_logout_redirect_uris:
      type: array
      items: { type: string, format: uri }
    scope: { type: string }
    token_endpoint_auth_method: { type: string, enum: [client_secret_basic] }
    grant_types:
      type: array
      items: { type: string, enum: [authorization_code, refresh_token] }
    response_types:
      type: array
      items: { type: string, enum: [code] }
    public: { type: boolean }
    type: { type: string, enum: [web] }
    disabled: { type: boolean }
    skip_consent: { type: boolean }
    enable_end_session: { type: boolean }
    require_pkce: { type: boolean }
    subject_type: { type: string, enum: [public] }
OAuthClientSecret:
  allOf:
    - $ref: '#/OAuthClient'
    - type: object
      required: [client_secret, client_secret_expires_at]
      properties:
        client_secret: { type: string, minLength: 1 }
        client_secret_expires_at: { type: integer, enum: [0] }
OAuthClientInput:
  type: object
  properties:
    client_id: { type: string, minLength: 1 }
    client_name: { type: string, minLength: 1 }
    client_uri: { type: string, format: uri, nullable: true }
    redirect_uris:
      type: array
      items: { type: string, format: uri }
    post_logout_redirect_uris:
      type: array
      items: { type: string, format: uri }
    scope: { type: string }
    token_endpoint_auth_method: { type: string, enum: [client_secret_basic] }
    grant_types:
      type: array
      items: { type: string, enum: [authorization_code, refresh_token] }
    response_types:
      type: array
      items: { type: string, enum: [code] }
    type: { type: string, enum: [web] }
OAuthClientUpdate:
  type: object
  required: [client_id, update]
  properties:
    client_id: { type: string, minLength: 1 }
    update: { $ref: '#/OAuthClientInput' }
