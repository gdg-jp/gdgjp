#cloud-config
# OCI Ampere A1 (VM.Standard.A1.Flex, 2 OCPU / 12 GB), Ubuntu 24.04 aarch64.
# After boot: install gdg (scripts/install-gdg.sh), put RUNNER_TOKEN in /etc/gdg/runner.env,
# log Codex in as `runner` (README.md §3), then `systemctl enable --now gdg-runner`.
package_update: true
packages: [git, curl, ca-certificates, unzip, bubblewrap, jq, python3, nodejs]

users:
  - default
  - name: runner
    shell: /bin/bash
    homedir: /home/runner
    lock_passwd: true

write_files:
  - path: /etc/gdg/runner.env
    permissions: "0640"
    content: |
      GDG_WIKI_URL=https://wiki.gdgs.jp
      # Same value as `wrangler secret put RUNNER_TOKEN` on the wiki Worker.
      RUNNER_TOKEN=
      RUNNER_BACKEND=codex
      RUNNER_WORKDIR=/var/lib/gdg-runner
      # RUNNER_MODEL=
  # pr.gdgs.jp drafts (gdg pr runner, docs/plans/pr/03-runner-and-drafts.md). Its own token.
  - path: /etc/gdg/pr-runner.env
    permissions: "0640"
    content: |
      GDG_PR_URL=https://pr.gdgs.jp
      # Same value as `wrangler secret put RUNNER_TOKEN` on the pr Worker (not the wiki's).
      RUNNER_TOKEN=
      RUNNER_BACKEND=codex
      RUNNER_WORKDIR=/var/lib/gdg-pr-runner
      YOMIYASU_DIR=/home/runner/.agents/skills/yomiyasu
  - path: /etc/systemd/system/gdg-pr-runner.service
    permissions: "0644"
    content: |
      [Unit]
      Description=GDG Japan PR runner (gdg pr runner)
      After=network-online.target
      Wants=network-online.target

      [Service]
      User=runner
      Group=runner
      EnvironmentFile=/etc/gdg/pr-runner.env
      ExecStart=/usr/local/bin/gdg pr runner
      WorkingDirectory=/var/lib/gdg-pr-runner
      Restart=always
      RestartSec=10
      NoNewPrivileges=true
      ProtectSystem=full
      PrivateTmp=true

      [Install]
      WantedBy=multi-user.target
  # Ubuntu 24.04 restricts unprivileged user namespaces; Codex's sandbox (bubblewrap) needs them.
  - path: /etc/apparmor.d/bwrap
    permissions: "0644"
    content: |
      abi <abi/4.0>,
      include <tunables/global>

      profile bwrap /usr/bin/bwrap flags=(unconfined) {
        userns,
        include if exists <local/bwrap>
      }
  - path: /etc/systemd/system/gdg-runner.service
    permissions: "0644"
    content: |
      [Unit]
      Description=GDG Japan knowledge runner (gdg wiki runner)
      After=network-online.target
      Wants=network-online.target

      [Service]
      User=runner
      Group=runner
      EnvironmentFile=/etc/gdg/runner.env
      ExecStart=/usr/local/bin/gdg wiki runner
      WorkingDirectory=/var/lib/gdg-runner
      Restart=always
      RestartSec=10
      NoNewPrivileges=true
      ProtectSystem=full
      PrivateTmp=true

      [Install]
      WantedBy=multi-user.target

runcmd:
  - apparmor_parser -r /etc/apparmor.d/bwrap
  # write_files runs before users are created, so the group is set here.
  - chown root:runner /etc/gdg/runner.env
  - install -d -o runner -g runner -m 0700 /var/lib/gdg-runner
  - chown root:runner /etc/gdg/pr-runner.env
  - install -d -o runner -g runner -m 0700 /var/lib/gdg-pr-runner
  # yomiyasu (Japanese proofreading) for the pr runner's checks.
  - sudo -u runner -H git clone --depth 1 https://github.com/nanaism/yomiyasu /home/runner/.cache/yomiyasu
  - sudo -u runner -H mkdir -p /home/runner/.agents/skills
  - sudo -u runner -H ln -sfn /home/runner/.cache/yomiyasu/skills/yomiyasu /home/runner/.agents/skills/yomiyasu
  # Codex CLI, pinned by version and sha256 (bump both together).
  - |
    set -e
    CODEX_VERSION=rust-v0.167.0
    CODEX_SHA256=843489acb4d4b1079745c36b03c5963b887b83155af208fd53584e33ee8eb281
    cd /tmp
    curl -fsSL -o codex.tar.gz "https://github.com/openai/codex/releases/download/${CODEX_VERSION}/codex-aarch64-unknown-linux-musl.tar.gz"
    echo "${CODEX_SHA256}  codex.tar.gz" | sha256sum -c -
    tar -xzf codex.tar.gz
    install -m 0755 codex-aarch64-unknown-linux-musl /usr/local/bin/codex
    rm -f codex.tar.gz codex-aarch64-unknown-linux-musl
    # Codex runs tool calls through this helper; without it every command fails.
    CODE_MODE_HOST_SHA256=6e99948fa20ca816a01f222a56afa261b321e00cbed611d76bb92c765fd11ec6
    curl -fsSL -o cmh.tar.gz "https://github.com/openai/codex/releases/download/${CODEX_VERSION}/codex-code-mode-host-aarch64-unknown-linux-musl.tar.gz"
    echo "${CODE_MODE_HOST_SHA256}  cmh.tar.gz" | sha256sum -c -
    tar -xzf cmh.tar.gz
    install -m 0755 codex-code-mode-host-aarch64-unknown-linux-musl /usr/local/bin/codex-code-mode-host
    rm -f cmh.tar.gz codex-code-mode-host-aarch64-unknown-linux-musl
  - systemctl daemon-reload
