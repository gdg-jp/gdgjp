post:
  operationId: internalUploadImage
  summary: Local TinyURL integration upload endpoint
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          required: [file, user, chapterId]
          properties:
            file: { type: string, format: binary, maxLength: 10485760 }
            user: { type: string, description: JSON-encoded InternalUploadUser }
            chapterId: { type: integer, minimum: 1 }
  responses:
    '200': { description: Uploaded image, content: { application/json: { schema: { $ref: ../components/schemas/index.yaml#/UploadResult } } } }
    '400': { description: Invalid image owner }
    '413': { description: Image exceeds 10 MiB }
    '415': { description: File is not an image }
