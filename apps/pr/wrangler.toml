name = "gdgjp-pr"
main = "./workers/app.ts"
compatibility_date = "2026-07-28"
compatibility_flags = ["nodejs_compat"]

[alias]
"virtual:react-router/server-build" = "./build/server/index.js"

[vars]
ENVIRONMENT = "production"
APP_URL = "https://pr.gdgs.jp"
ACCOUNTS_URL = "https://accounts.gdgs.jp"
IDP_URL = "https://accounts.gdgs.jp"
IDP_CLIENT_ID = "pr"
WIKI_URL = "https://wiki.gdgs.jp"
# Title of the Wiki page that is the source of truth for outreach targets (contacts).
WIKI_OUTREACH_TITLE = "イベント告知対象とコネクション保有者"

[assets]
binding = "ASSETS"
directory = "./build/client"

[[routes]]
pattern = "pr.gdgs.jp"
custom_domain = true

# Relying-party auth tables (user, oidc_session) and the PR domain tables.
[[d1_databases]]
binding = "DB"
database_name = "gdgjp-pr-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "./migrations"

# Worker-to-Worker OIDC (discovery, token, UserInfo) stays on Cloudflare's
# internal network instead of looping through public HTTPS.
[[services]]
binding = "ACCOUNTS"
service = "gdgjp-accounts"

# Read-only: the outreach targets page, read AS the signed-in user (their access token).
[[services]]
binding = "WIKI"
service = "gdgjp-wiki"

# Delivery (Stage 03): sns schedules X posts, tinyurl makes campaigns, channels and short links.
# Both authorize the actor pr passes with their own permission rules. Locally, `pnpm dev`
# replaces them with e2e/mock-services (vite.config.ts) unless PR_REAL_SERVICES=1.
[[services]]
binding = "SNS"
service = "gdgjp-sns"
entrypoint = "PrService"

[[services]]
binding = "TINYURL"
service = "gdgjp-tinyurl"
entrypoint = "PrService"

# connpass (Stage 04): page, survey, image, mail, sub-events and publishing, as jobs of the connpass
# app (it holds the bot session). pr never touches connpass.com itself.
[[services]]
binding = "CONNPASS"
service = "gdgjp-connpass"
entrypoint = "PrService"

# Every minute: runner lease requeue, staff reminders, Discord posts, review requests, follow-ups.
# Hourly: sns post status, short-link health.
[triggers]
crons = ["* * * * *", "0 * * * *"]

# Secrets: RP_SESSION_SECRET, IDP_CLIENT_SECRET, RUNNER_TOKEN (32+ chars; not the wiki's value),
# SETTINGS_ENCRYPTION_KEY (AES-GCM key material for chapters' Discord webhook URLs).

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true
