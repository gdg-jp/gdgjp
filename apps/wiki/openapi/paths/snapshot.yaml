get:
  operationId: getWikiSnapshot
  summary: Get Wiki pages visible to the CLI token (agent origin only)
  security:
    - BearerAuth: []
  parameters:
    - name: lang
      in: query
      required: false
      schema:
        type: string
        enum: [ja, en]
        default: ja
      description: Return only the selected locale. Other locale fields are omitted.
  responses:
    '200':
      description: Current Wiki snapshot.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/wiki.yaml#/Snapshot
    '401':
      $ref: ../components/responses/common.yaml#/Unauthorized
    '400':
      $ref: ../components/responses/common.yaml#/BadRequest
