get:
  operationId: getWikiSources
  summary: Get raw-source manifest visible to the CLI token
  security:
    - BearerAuth: []
  parameters:
    - name: lang
      in: query
      required: false
      schema:
        type: string
        enum: [ja, en]
        default: ja
      description: Locale used when materializing wiki-human manifest entries.
  responses:
    '200':
      description: Source manifest.
    '401':
      $ref: ../components/responses/common.yaml#/Unauthorized
    '400':
      $ref: ../components/responses/common.yaml#/BadRequest
