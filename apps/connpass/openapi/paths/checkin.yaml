post:
  operationId: checkInParticipant
  summary: Check in a participant from a reception QR URL
  description: >
    Opens the connpass reception QR URL (`https://connpass.com/event/{eventId}/qr_checkin/{n}/{n}/`)
    as the bot account, which marks the participant as attended. Runs synchronously and reports
    only whether the check-in succeeded. Requires organizer access to the event's allowlisted group,
    and the bot account must be a co-admin of the event on connpass.
  security: [{BearerAuth: []}]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [url]
          properties:
            url:
              type: string
              format: uri
              example: https://connpass.com/event/388434/qr_checkin/831287/7082717/
  responses:
    "200":
      description: Check-in result
      content:
        application/json:
          schema:
            type: object
            required: [checkedIn]
            properties:
              checkedIn: {type: boolean}
    "400": {$ref: ../components/responses/common.yaml#/BadRequest}
    "401": {$ref: ../components/responses/common.yaml#/Unauthorized}
    "403": {$ref: ../components/responses/common.yaml#/Forbidden}
