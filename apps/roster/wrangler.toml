name = "gdgjp-roster"
main = "./workers/app.ts"
compatibility_date = "2026-07-28"
compatibility_flags = ["nodejs_compat"]

[alias]
"virtual:react-router/server-build" = "./build/server/index.js"

[vars]
ENVIRONMENT = "production"
APP_URL = "https://roster.gdgs.jp"
ACCOUNTS_URL = "https://accounts.gdgs.jp"
IDP_URL = "https://accounts.gdgs.jp"
IDP_CLIENT_ID = "roster"

[assets]
binding = "ASSETS"
directory = "./build/client"

[[routes]]
pattern = "roster.gdgs.jp/*"
zone_name = "gdgs.jp"

# Relying-party auth tables (user, oidc_session) and roster domain tables.
[[d1_databases]]
binding = "DB"
database_name = "gdgjp-roster-db"
database_id = "3e91f8ac-5138-4351-bbed-c4001307d855"
migrations_dir = "./migrations"

# Worker-to-Worker OIDC (discovery, token, UserInfo) stays on Cloudflare's
# internal network instead of looping through public HTTPS.
[[services]]
binding = "ACCOUNTS"
service = "gdgjp-accounts"

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true
