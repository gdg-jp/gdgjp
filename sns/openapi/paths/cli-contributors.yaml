collection:
  get:
    operationId: listCliContributors
    summary: List a chapter's contributors (organizer only)
    security: [{ BearerAuth: [] }]
    parameters:
      - $ref: ../components/parameters/common.yaml#/ChapterIdQuery
      - $ref: ../components/parameters/common.yaml#/Limit
      - $ref: ../components/parameters/common.yaml#/Cursor
    responses:
      '200':
        description: A bounded page of the chapter's contributors.
        content:
          application/json:
            schema: { $ref: ../components/schemas/index.yaml#/ContributorList }
      '400': { $ref: ../components/responses/common.yaml#/CliBadRequest }
      '401': { $ref: ../components/responses/common.yaml#/CliUnauthorized }
      '403': { $ref: ../components/responses/common.yaml#/CliForbidden }
  post:
    operationId: addCliContributor
    summary: Grant a user contributor access to a chapter (organizer only)
    security: [{ BearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/schemas/index.yaml#/AddContributorRequest }
    responses:
      '201':
        description: The contributor grant (idempotent — an existing grant is left untouched).
        content:
          application/json:
            schema: { $ref: ../components/schemas/index.yaml#/AddContributorResult }
      '400': { $ref: ../components/responses/common.yaml#/CliBadRequest }
      '401': { $ref: ../components/responses/common.yaml#/CliUnauthorized }
      '403': { $ref: ../components/responses/common.yaml#/CliForbidden }
  delete:
    operationId: removeCliContributor
    summary: Revoke a user's contributor access to a chapter (organizer only)
    description: >-
      Contributor deletion is addressed by `chapterId` + `userEmail` query
      parameters, NOT a `/contributors/{id}` path. This is deliberate: the
      `sns_contributors` table has no single-column id — its primary key is the
      `(chapter_id, user_email)` pair — so there is no id to put in the path.
      This is the one resource in this API that does not follow the `/{id}`
      convention.
    security: [{ BearerAuth: [] }]
    parameters:
      - $ref: ../components/parameters/common.yaml#/ChapterIdQuery
      - name: userEmail
        in: query
        required: true
        schema: { type: string, format: email }
    responses:
      '200':
        description: The contributor grant was removed (idempotent).
        content:
          application/json:
            schema: { $ref: ../components/schemas/index.yaml#/DeleteContributorResult }
      '400': { $ref: ../components/responses/common.yaml#/CliBadRequest }
      '401': { $ref: ../components/responses/common.yaml#/CliUnauthorized }
      '403': { $ref: ../components/responses/common.yaml#/CliForbidden }
