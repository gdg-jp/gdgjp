ChapterIdQuery:
  name: chapterId
  in: query
  required: true
  schema: { type: integer, minimum: 1 }
Limit:
  name: limit
  in: query
  required: false
  schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
Cursor:
  name: cursor
  in: query
  required: false
  schema: { type: string }
ResourceIdPath:
  name: id
  in: path
  required: true
  schema: { type: string, minLength: 1 }
