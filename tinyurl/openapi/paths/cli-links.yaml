get:
  operationId: listCliLinks
  summary: List links visible to the caller
  security: [{ BearerAuth: [] }]
  parameters:
    - { name: folderId, in: query, schema: { type: integer } }
    - { name: tagId, in: query, schema: { type: integer } }
    - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
    - { name: cursor, in: query, schema: { type: string } }
  responses:
    '200': { description: Visible links }
    '400': { $ref: ../components/responses/cli.yaml#/CliBadRequest }
    '401': { $ref: ../components/responses/cli.yaml#/CliUnauthorized }
post:
  operationId: createCliLink
  summary: Create a short link
  security: [{ BearerAuth: [] }]
  requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
  responses:
    '201': { description: Created link }
    '400': { $ref: ../components/responses/cli.yaml#/CliBadRequest }
    '401': { $ref: ../components/responses/cli.yaml#/CliUnauthorized }
    '403': { $ref: ../components/responses/cli.yaml#/CliForbidden }
    '409': { $ref: ../components/responses/cli.yaml#/CliConflict }
