CampaignChannel:
  type: object
  required: [id, campaignId, name, code, sortOrder, archivedAt]
  properties:
    id:
      type: integer
    campaignId:
      type: integer
    name:
      type: string
    code:
      type: string
    sortOrder:
      type: integer
    archivedAt:
      type: integer
      nullable: true
CliCampaignChannelResponse:
  type: object
  required: [channel]
  properties:
    channel:
      $ref: '#/CampaignChannel'
CliCampaignChannelList:
  type: object
  required: [channels, nextCursor]
  properties:
    channels:
      type: array
      items:
        $ref: '#/CampaignChannel'
    nextCursor:
      type: string
      nullable: true
