name: Import Google Photos albums

on:
  workflow_dispatch:

concurrency:
  group: google-photos-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: node sns/google-photos-importer/server.mjs
        env:
          GOOGLE_PHOTOS_IMPORT_URL: ${{ vars.SNS_GOOGLE_PHOTOS_IMPORT_URL }}
          GOOGLE_PHOTOS_IMPORT_TOKEN: ${{ secrets.SNS_GOOGLE_PHOTOS_IMPORT_TOKEN }}
          GOOGLE_PHOTOS_DEBUG_DIR: ${{ runner.temp }}/google-photos-debug
      - name: Upload Google Photos diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: google-photos-diagnostics
          path: ${{ runner.temp }}/google-photos-debug
          if-no-files-found: ignore
          retention-days: 3
