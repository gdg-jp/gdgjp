name: Staging deploy

on:
  workflow_call:
    inputs:
      slot:
        type: string
        required: true
      ref:
        type: string
        required: true
      pr:
        type: string
        required: false
        default: ""

env:
  NODE_VERSION: "22"

jobs:
  build:
    name: Build ${{ inputs.slot }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: false
          persist-credentials: false
      - name: Initialize shared UI and Playbook submodules
        run: git submodule update --init packages/design-system skills
      - name: Build and bundle every Worker in a container without the runner's credentials
        env:
          IMAGE: node:${{ env.NODE_VERSION }}-bookworm
        run: >-
          docker run --rm --user "$(id -u):$(id -g)"
          --env CI=true --env HOME=/tmp/home --env COREPACK_HOME=/tmp/corepack
          --env COREPACK_ENABLE_DOWNLOAD_PROMPT=0 --env npm_config_store_dir=/tmp/pnpm-store
          --volume "$GITHUB_WORKSPACE:/work" --workdir /work "$IMAGE"
          bash -ec 'mkdir -p /tmp/home /tmp/bin;
          corepack enable --install-directory /tmp/bin; export PATH="/tmp/bin:$PATH";
          pnpm install --frozen-lockfile; node scripts/staging/staging.mjs build'
      - name: Package deployable output
        run: |
          shopt -s nullglob
          paths=()
          for app in apps/*/; do
            app=${app%/}
            for entry in package.json wrangler.toml wrangler.jsonc migrations build .staging-bundle .open-next/assets; do
              [ -e "$app/$entry" ] && paths+=("$app/$entry")
            done
          done
          tar --exclude=node_modules --exclude='build/server/.dev.vars*' -czf "$RUNNER_TEMP/staging.tgz" \
            "${paths[@]}" apps/tinyurl-gateway/api apps/tinyurl-gateway/src apps/tinyurl-gateway/public \
            apps/tinyurl-gateway/vercel.json apps/tinyurl-gateway/tsconfig.json
      - uses: actions/upload-artifact@v4
        with:
          name: staging-${{ inputs.slot }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/staging.tgz
          retention-days: 1

  deploy:
    name: Deploy ${{ inputs.slot }}
    needs: build
    runs-on: ubuntu-24.04
    environment: staging
    concurrency:
      group: staging-${{ inputs.slot }}
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_ROOT_SECRET: ${{ secrets.STAGING_ROOT_SECRET }}
      GH_TOKEN: ${{ github.token }}
      SLOT: ${{ inputs.slot }}
      REF: ${{ inputs.ref }}
      PR: ${{ inputs.pr }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          submodules: false
      - name: Initialize shared UI submodule
        run: git submodule update --init packages/design-system
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Record the slot deployment
        id: record
        run: |
          id=$(jq -n --arg ref "$REF" --arg slot "$SLOT" --arg pr "$PR" \
            '{ref: $ref, environment: $slot, auto_merge: false, required_contexts: [],
              transient_environment: false, payload: {pr: $pr},
              description: (if $pr == "" then "main" else "PR #\($pr)" end)}' \
            | gh api "repos/${GITHUB_REPOSITORY}/deployments" --input - --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"
          gh api "repos/${GITHUB_REPOSITORY}/deployments/$id/statuses" -f state=in_progress \
            -f log_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
      - uses: actions/download-artifact@v4
        with:
          name: staging-${{ inputs.slot }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}
      - name: Unpack the build without executing it
        run: |
          mkdir -p "$RUNNER_TEMP/source"
          tar -xzf "$RUNNER_TEMP/staging.tgz" -C "$RUNNER_TEMP/source" --no-same-owner
          echo "STAGING_SOURCE=$RUNNER_TEMP/source" >> "$GITHUB_ENV"
      - name: Deploy every Worker to the slot
        env:
          STAGING_EXT__ACCOUNTS__GOOGLE_CLIENT_ID: ${{ secrets.STAGING_EXT__ACCOUNTS__GOOGLE_CLIENT_ID }}
          STAGING_EXT__ACCOUNTS__GOOGLE_CLIENT_SECRET: ${{ secrets.STAGING_EXT__ACCOUNTS__GOOGLE_CLIENT_SECRET }}
        run: node scripts/staging/staging.mjs deploy --slot "$SLOT"
      - name: Install Playwright browser
        run: pnpm --filter @gdgjp/accounts exec playwright install chromium
      - name: Locate the slot's relying parties
        run: node scripts/staging/staging.mjs e2e-env --slot "$SLOT" --github-env
      - name: Sign in to every relying party
        env:
          E2E_ACCESS_CLIENT_ID: ${{ secrets.STAGING_ACCESS_CLIENT_ID }}
          E2E_ACCESS_CLIENT_SECRET: ${{ secrets.STAGING_ACCESS_CLIENT_SECRET }}
        run: pnpm --filter @gdgjp/accounts exec playwright test --config playwright.staging.config.ts
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-${{ inputs.slot }}-playwright-report
          path: apps/accounts/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Report the result
        if: always() && steps.record.outputs.id
        env:
          RESULT: ${{ job.status }}
          DEPLOYMENT: ${{ steps.record.outputs.id }}
        run: |
          state=$([ "$RESULT" = success ] && echo success || echo failure)
          label=${SLOT/-/}
          gh api "repos/${GITHUB_REPOSITORY}/deployments/$DEPLOYMENT/statuses" -f state="$state" \
            -f environment_url="https://accounts.${label}.gdgs.jp" \
            -f log_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
          if [ -n "$PR" ] && [ "$GITHUB_EVENT_NAME" = pull_request_target ]; then
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "Staging \`${SLOT}\` deploy of ${REF::12}: **${RESULT}**. Accounts: https://accounts.${label}.gdgs.jp · [run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
          fi
