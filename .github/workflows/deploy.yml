name: Deploy

on:
  push:
    branches: [main]
    tags: ["cli/v*", "extension/v*"]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"

jobs:
  changes:
    name: Detect deploy targets
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.changes.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect affected applications
        id: changes
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            node .github/scripts/changed-workspaces.mjs --all
          else
            node .github/scripts/changed-workspaces.mjs --base "$BASE_SHA" --head "$HEAD_SHA"
          fi

  release-cli:
    name: Release CLI
    if: startsWith(github.ref, 'refs/tags/cli/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Test and build release archives
        working-directory: cli
        env:
          CLI_VERSION: ${{ github.ref_name }}
        run: |
          go test ./...
          VERSION="${CLI_VERSION#cli/v}"
          mkdir -p dist
          for TARGET in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            OS="${TARGET%/*}"
            ARCH="${TARGET#*/}"
            BINARY="gdg"
            if [ "$OS" = windows ]; then BINARY="gdg.exe"; fi
            STAGE="dist/gdg_${VERSION}_${OS}_${ARCH}"
            mkdir -p "$STAGE"
            GOOS="$OS" GOARCH="$ARCH" go build -trimpath -ldflags "-s -w -X github.com/gdg-jp/gdgjp/cli/internal/command.version=$VERSION" -o "$STAGE/$BINARY" ./cmd/gdg
            (cd "$STAGE" && zip -q "../gdg_${VERSION}_${OS}_${ARCH}.zip" "$BINARY")
            rm -rf "$STAGE"
          done
          (cd dist && sha256sum gdg_*.zip > checksums.txt)
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create "$TAG_NAME" cli/dist/* --title "GDG CLI ${TAG_NAME#cli/}" --generate-notes

  release-go-extension:
    name: Release Go extension
    if: startsWith(github.ref, 'refs/tags/extension/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "9.15.0"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Go extension
        run: pnpm --filter @gdgjp/go-extension build
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create "$TAG_NAME" go-extension/dist/gdg-japan-go-links.zip --title "GDG Japan Go Links ${TAG_NAME#extension/}" --generate-notes

  deploy:
    name: Deploy (${{ matrix.target.app }})
    needs: changes
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.deploy != '[]'
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.changes.outputs.deploy) }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "9.15.0"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build ${{ matrix.target.app }}
        run: pnpm --filter ${{ matrix.target.workspace }} build

      - name: Deploy ${{ matrix.target.app }} to Cloudflare Workers
        if: matrix.target.provider == 'cloudflare'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ matrix.target.app }}
          packageManager: pnpm
          command: deploy

      - name: Deploy tinyurl gateway to Vercel
        if: matrix.target.provider == 'vercel-gateway'
        run: pnpm --filter @gdgjp/tinyurl-gateway exec vercel deploy --prod --yes --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy agents to Vercel
        if: matrix.target.provider == 'vercel-agents'
        # agents/ depends on @gdgjp/gdg-lib via workspace:* and ships that
        # package as untranspiled TS. Run every Vercel command from the
        # monorepo root so the project's `agents` Root Directory is applied
        # exactly once and the local build can resolve workspace packages.
        # Deploying the prebuilt output also avoids a remote install.
        run: |
          pnpm --filter @gdgjp/agents exec vercel pull --cwd "$GITHUB_WORKSPACE" --yes --environment=production --token="$VERCEL_TOKEN"
          pnpm --filter @gdgjp/agents exec vercel build --cwd "$GITHUB_WORKSPACE" --prod --token="$VERCEL_TOKEN"
          pnpm --filter @gdgjp/agents exec vercel deploy --cwd "$GITHUB_WORKSPACE" --prebuilt --prod --yes --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_AGENTS }}

      - name: Apply ${{ matrix.target.app }} remote migrations
        if: matrix.target.migrate
        run: pnpm --filter ${{ matrix.target.workspace }} migrate:remote
