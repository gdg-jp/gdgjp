name: Deploy

on:
  push:
    branches: [main]
    tags: ["cli/v*", "extension/v*"]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"

jobs:
  changes:
    name: Detect deploy targets
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.changes.outputs.deploy }}
      deploy-apps: ${{ steps.changes.outputs.deploy-apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect affected applications
        id: changes
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            node .github/scripts/changed-workspaces.mjs --all
          else
            node .github/scripts/changed-workspaces.mjs --base "$BASE_SHA" --head "$HEAD_SHA"
          fi

  release-cli:
    name: Release CLI
    if: startsWith(github.ref, 'refs/tags/cli/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Test and build release archives
        working-directory: cli
        env:
          CLI_VERSION: ${{ github.ref_name }}
        run: |
          go test ./...
          VERSION="${CLI_VERSION#cli/v}"
          mkdir -p dist
          for TARGET in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            OS="${TARGET%/*}"
            ARCH="${TARGET#*/}"
            BINARY="gdg"
            if [ "$OS" = windows ]; then BINARY="gdg.exe"; fi
            STAGE="dist/gdg_${VERSION}_${OS}_${ARCH}"
            mkdir -p "$STAGE"
            GOOS="$OS" GOARCH="$ARCH" go build -trimpath -ldflags "-s -w -X github.com/gdg-jp/gdgjp/cli/internal/command.version=$VERSION" -o "$STAGE/$BINARY" ./cmd/gdg
            (cd "$STAGE" && zip -q "../gdg_${VERSION}_${OS}_${ARCH}.zip" "$BINARY")
            rm -rf "$STAGE"
          done
          (cd dist && sha256sum gdg_*.zip > checksums.txt)
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create "$TAG_NAME" cli/dist/* --title "GDG CLI ${TAG_NAME#cli/}" --generate-notes

  release-go-extension:
    name: Release Go extension
    if: startsWith(github.ref, 'refs/tags/extension/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "9.15.0"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Go extension
        run: pnpm --filter @gdgjp/go-extension build
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create "$TAG_NAME" go-extension/dist/gdg-japan-go-links.zip --title "GDG Japan Go Links ${TAG_NAME#extension/}" --generate-notes

  deploy:
    name: Deploy
    needs: changes
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.deploy != '[]'
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "9.15.0"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - parallel:
          - name: Build, deploy, and migrate accounts
            if: contains(fromJSON(needs.changes.outputs.deploy-apps), 'accounts')
            run: |
              pnpm --filter @gdgjp/accounts build
              pnpm --filter @gdgjp/accounts run deploy
              pnpm --filter @gdgjp/accounts migrate:remote
          - name: Build, deploy, and migrate tinyurl
            if: contains(fromJSON(needs.changes.outputs.deploy-apps), 'tinyurl')
            run: |
              pnpm --filter @gdgjp/tinyurl build
              pnpm --filter @gdgjp/tinyurl run deploy
              pnpm --filter @gdgjp/tinyurl migrate:remote
          - name: Build, deploy, and migrate wiki
            if: contains(fromJSON(needs.changes.outputs.deploy-apps), 'wiki')
            run: |
              pnpm --filter @gdgjp/wiki build
              pnpm --filter @gdgjp/wiki run deploy
              pnpm --filter @gdgjp/wiki migrate:remote
          - name: Build, deploy, and migrate img
            if: contains(fromJSON(needs.changes.outputs.deploy-apps), 'img')
            run: |
              pnpm --filter @gdgjp/img build
              pnpm --filter @gdgjp/img run deploy
              pnpm --filter @gdgjp/img migrate:remote
          - name: Build, deploy, and migrate scheduler
            if: contains(fromJSON(needs.changes.outputs.deploy-apps), 'scheduler')
            run: |
              pnpm --filter @gdgjp/scheduler build
              pnpm --filter @gdgjp/scheduler run deploy
              pnpm --filter @gdgjp/scheduler migrate:remote
          - name: Build, deploy, and migrate SNS
            if: contains(fromJSON(needs.changes.outputs.deploy-apps), 'sns')
            run: |
              pnpm --filter @gdgjp/sns build
              pnpm --filter @gdgjp/sns run deploy
              pnpm --filter @gdgjp/sns migrate:remote
          - name: Build and deploy website
            if: contains(fromJSON(needs.changes.outputs.deploy-apps), 'website')
            run: |
              pnpm --filter @gdgjp/website build
              pnpm --filter @gdgjp/website run deploy
          - name: Build and deploy tinyurl gateway
            if: contains(fromJSON(needs.changes.outputs.deploy-apps), 'tinyurl-gateway')
            run: |
              pnpm --filter @gdgjp/tinyurl-gateway build
              pnpm --filter @gdgjp/tinyurl-gateway exec vercel deploy --prod --yes --token="$VERCEL_TOKEN"
            env:
              VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
              VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
              VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          - name: Build and deploy agents
            if: contains(fromJSON(needs.changes.outputs.deploy-apps), 'agents')
            # agents/ depends on @gdgjp/gdg-lib via workspace:* and ships that
            # package as untranspiled TS. Run every Vercel command from the
            # monorepo root so the project's `agents` Root Directory is applied
            # exactly once and the local build can resolve workspace packages.
            # Deploying the prebuilt output also avoids a remote install.
            run: |
              pnpm --filter @gdgjp/agents build
              pnpm --filter @gdgjp/agents exec vercel pull --cwd "$GITHUB_WORKSPACE" --yes --environment=production --token="$VERCEL_TOKEN"
              pnpm --filter @gdgjp/agents exec vercel build --cwd "$GITHUB_WORKSPACE" --prod --token="$VERCEL_TOKEN"
              pnpm --filter @gdgjp/agents exec vercel deploy --cwd "$GITHUB_WORKSPACE" --prebuilt --prod --yes --token="$VERCEL_TOKEN"
              node --env-file="$GITHUB_WORKSPACE/.vercel/.env.production.local" agents/scripts/sync-discord-commands.mjs
            env:
              VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
              VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
              VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_AGENTS }}
