name: Staging data sync

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      apps:
        description: Comma-separated apps to copy (default all)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: staging-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Copy production data into every slot
    if: vars.STAGING_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_ROOT_SECRET: ${{ secrets.STAGING_ROOT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Initialize shared UI submodule
        run: git submodule update --init packages/design-system
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Replace slot data with production data
        env:
          APPS: ${{ inputs.apps }}
        run: node scripts/staging/staging.mjs sync ${APPS:+--apps "$APPS"}

  select:
    name: Select slot refs
    needs: sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
    outputs:
      targets: ${{ steps.select.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/staging
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: schedule
          MAIN_SHA: ${{ github.sha }}
        run: node scripts/staging/select.mjs >> "$GITHUB_OUTPUT"

  redeploy:
    name: Redeploy
    needs: select
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.select.outputs.targets) }}
    uses: ./.github/workflows/staging-deploy.yml
    with:
      slot: ${{ matrix.target.slot }}
      ref: ${{ matrix.target.ref }}
      pr: ${{ matrix.target.pr }}
    secrets: inherit
    permissions:
      contents: read
      deployments: write
      pull-requests: write

  durable-objects:
    name: Copy Durable Object storage into every slot
    needs: [sync, redeploy]
    if: always() && needs.sync.result == 'success'
    runs-on: ubuntu-24.04
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Initialize shared UI submodule
        run: git submodule update --init packages/design-system
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Copy production Durable Objects
        env:
          APPS: ${{ inputs.apps }}
        run: node scripts/staging/staging.mjs sync-durable-objects ${APPS:+--apps "$APPS"}
