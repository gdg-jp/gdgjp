name: AI review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled, closed]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to process; empty processes every open pull request
        required: false
        type: string

permissions: {}

env:
  NODE_VERSION: "22"
  CODEX_VERSION: "0.171.0"

jobs:
  dispatch:
    name: Hand off to main
    if: >-
      (github.event_name == 'pull_request'
        || github.event_name == 'pull_request_review_comment'
        || github.event_name == 'issue_comment')
      && github.event.sender.type != 'Bot'
      && (github.event.pull_request == null
        || github.event.pull_request.head.repo.full_name == github.repository)
      && (github.event_name != 'pull_request'
        || github.event.action != 'labeled'
        || github.event.label.name == 'E-code-review')
      && (github.event_name != 'issue_comment'
        || (github.event.issue.pull_request
          && (contains(github.event.comment.body, '/ai-review')
            || contains(github.event.comment.body, '@gdg-chan'))))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: gh workflow run ai-review.yml --repo "$REPOSITORY" --ref main -f pr="$PR"

  plan:
    name: Plan
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ai-review
    permissions:
      actions: read
      contents: read
    outputs:
      numbers: ${{ steps.plan.outputs.numbers }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GDG_CHAN_APP_ID: ${{ vars.GDG_CHAN_APP_ID }}
          GDG_CHAN_PRIVATE_KEY: ${{ secrets.GDG_CHAN_PRIVATE_KEY }}
          AI_REVIEW_SIGNING_KEY: ${{ secrets.AI_REVIEW_SIGNING_KEY }}
        run: node .github/scripts/codex-review.mjs plan

  agent:
    name: Agent
    needs: plan
    if: needs.plan.outputs.numbers != ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: ai-review
    concurrency:
      group: codex-auth
      cancel-in-progress: false
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Codex
        run: npm install --global "@openai/codex@${CODEX_VERSION}"
      - name: Allow the Codex sandbox to create user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Restore Codex login
        id: restore
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CODEX_AUTH_KEY: ${{ secrets.CODEX_AUTH_KEY }}
          CODEX_ACCOUNT_SHA256: ${{ secrets.CODEX_ACCOUNT_SHA256 }}
        run: |
          echo "CODEX_HOME=$RUNNER_TEMP/codex-home" >> "$GITHUB_ENV"
          node .github/scripts/codex-auth.mjs restore "$RUNNER_TEMP/codex-home"
      - name: Check that the sandbox hides the Codex login
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/codex-review.mjs sandbox-check
      - name: Run Codex agent
        env:
          GDG_CHAN_APP_ID: ${{ vars.GDG_CHAN_APP_ID }}
          GDG_CHAN_PRIVATE_KEY: ${{ secrets.GDG_CHAN_PRIVATE_KEY }}
          AI_REVIEW_SIGNING_KEY: ${{ secrets.AI_REVIEW_SIGNING_KEY }}
          CODEX_MODEL: ${{ vars.CODEX_REVIEW_MODEL || 'gpt-6.2-astra' }}
          CODEX_EFFORT: ${{ vars.CODEX_REVIEW_EFFORT || 'medium' }}
          NUMBERS: ${{ needs.plan.outputs.numbers }}
        run: node .github/scripts/codex-review.mjs agent "$NUMBERS"
      - name: Prepare refreshed Codex login
        id: save
        if: always() && steps.restore.outcome == 'success'
        env:
          CODEX_AUTH_KEY: ${{ secrets.CODEX_AUTH_KEY }}
          CODEX_ACCOUNT_SHA256: ${{ secrets.CODEX_ACCOUNT_SHA256 }}
        run: node .github/scripts/codex-auth.mjs save "$CODEX_HOME" "$RUNNER_TEMP/codex-auth-upload"
      - name: Store refreshed Codex login
        if: always() && steps.save.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: codex-auth
          path: ${{ runner.temp }}/codex-auth-upload/codex-auth.enc
          retention-days: 90
          if-no-files-found: error
      - name: Delete older Codex logins
        if: always() && steps.save.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/codex-auth.mjs prune
