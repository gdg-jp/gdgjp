name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      ci: ${{ steps.changes.outputs.ci }}
      build: ${{ steps.changes.outputs.build }}
      e2e: ${{ steps.changes.outputs.e2e }}
      lint: ${{ steps.changes.outputs.lint }}
      openapi: ${{ steps.changes.outputs.openapi }}
      script-tests: ${{ steps.changes.outputs.script-tests }}
      go: ${{ steps.changes.outputs.go }}
      full: ${{ steps.changes.outputs.full }}
      base: ${{ steps.changes.outputs.base }}
      head: ${{ steps.changes.outputs.head }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect affected workspaces
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/changed-workspaces.mjs --base "$BASE_SHA" --head "$HEAD_SHA"

  lint:
    name: Lint (Biome)
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint affected files
        env:
          BASE_SHA: ${{ needs.changes.outputs.base }}
          HEAD_SHA: ${{ needs.changes.outputs.head }}
          FULL_CHECK: ${{ needs.changes.outputs.full }}
        run: |
          if [[ "$FULL_CHECK" == "true" ]]; then
            pnpm lint
            exit
          fi
          mapfile -d '' files < <(git diff --diff-filter=ACMRTUXB --name-only -z --no-renames "$BASE_SHA" "$HEAD_SHA")
          if (( ${#files[@]} == 0 )); then
            exit
          fi
          pnpm exec biome check --files-ignore-unknown=true --no-errors-on-unmatched -- "${files[@]}"

  script-tests:
    name: Workflow script tests
    needs: changes
    if: needs.changes.outputs.script-tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:acl
      - run: pnpm sync:agent-host-assets
      - run: go build -C cli -o /tmp/gdg-ci ./cmd/gdg
      - run: node --test .github/scripts/*.test.mjs
        env:
          GDG_BIN: /tmp/gdg-ci

  openapi:
    name: OpenAPI contracts
    needs: changes
    if: needs.changes.outputs.openapi == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: pnpm install --frozen-lockfile
      - run: pnpm openapi:check

  go:
    name: Go (${{ matrix.module.name }})
    needs: changes
    if: needs.changes.outputs.go != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Entries come from GO_MODULES in .github/scripts/changed-workspaces.mjs.
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.go) }}
    steps:
      - uses: actions/checkout@v4
      # Only modules that declare generated inputs need the pnpm workspace.
      - uses: pnpm/action-setup@v4
        if: matrix.module.prepare != ''
      - uses: actions/setup-node@v4
        if: matrix.module.prepare != ''
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module.directory }}/go.mod
          cache-dependency-path: ${{ matrix.module.directory }}/go.sum
      - name: Materialise generated inputs
        if: matrix.module.prepare != ''
        env:
          PREPARE: ${{ matrix.module.prepare }}
        run: |
          pnpm install --frozen-lockfile
          for script in $PREPARE; do
            pnpm "$script"
          done
          # Some generated inputs are copies of tracked sources. Regenerating
          # them must not change the tree, or the committed copy has drifted.
          git diff --exit-code
      - name: gofmt, vet, test, and build
        working-directory: ${{ matrix.module.directory }}
        env:
          PACKAGES: ${{ matrix.module.packages }}
          TARGETS: ${{ matrix.module.targets }}
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            printf 'Files requiring gofmt:\n%s\n' "$unformatted" >&2
            exit 1
          fi
          go vet ./...
          go test ./...
          go build ./...
          for target in $TARGETS; do
            OS="${target%/*}"
            ARCH="${target#*/}"
            for package in $PACKAGES; do
              GOOS="$OS" GOARCH="$ARCH" go build -o /dev/null "$package"
            done
          done

  typecheck:
    name: Typecheck
    needs: changes
    if: needs.changes.outputs.ci != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - parallel:
          - name: Typecheck accounts
            if: contains(fromJSON(needs.changes.outputs.ci), '@gdgjp/accounts')
            run: |
              cp accounts/.dev.vars.example accounts/.dev.vars
              pnpm --filter @gdgjp/accounts typecheck
          - name: Typecheck tinyurl
            if: contains(fromJSON(needs.changes.outputs.ci), '@gdgjp/tinyurl')
            run: pnpm --filter @gdgjp/tinyurl typecheck
          - name: Typecheck wiki
            if: contains(fromJSON(needs.changes.outputs.ci), '@gdgjp/wiki')
            run: pnpm --filter @gdgjp/wiki typecheck
          - name: Typecheck img
            if: contains(fromJSON(needs.changes.outputs.ci), '@gdgjp/img')
            run: pnpm --filter @gdgjp/img typecheck
          - name: Typecheck scheduler
            if: contains(fromJSON(needs.changes.outputs.ci), '@gdgjp/scheduler')
            run: pnpm --filter @gdgjp/scheduler typecheck
          - name: Typecheck SNS
            if: contains(fromJSON(needs.changes.outputs.ci), '@gdgjp/sns')
            run: pnpm --filter @gdgjp/sns typecheck
          - name: Typecheck pay
            if: contains(fromJSON(needs.changes.outputs.ci), '@gdgjp/pay')
            run: pnpm --filter @gdgjp/pay typecheck
          - name: Typecheck ost
            if: contains(fromJSON(needs.changes.outputs.ci), '@gdgjp/ost')
            run: pnpm --filter @gdgjp/ost typecheck
          - name: Typecheck discord-relay
            if: contains(fromJSON(needs.changes.outputs.ci), '@gdgjp/discord-relay')
            run: pnpm --filter @gdgjp/discord-relay typecheck
          - name: Typecheck website
            if: contains(fromJSON(needs.changes.outputs.ci), '@gdgjp/website')
            run: pnpm --filter @gdgjp/website typecheck
          - name: Typecheck gdg-lib
            if: contains(fromJSON(needs.changes.outputs.ci), '@gdgjp/gdg-lib')
            run: pnpm --filter @gdgjp/gdg-lib typecheck
          - name: Typecheck tinyurl gateway
            if: contains(fromJSON(needs.changes.outputs.ci), '@gdgjp/tinyurl-gateway')
            run: pnpm --filter @gdgjp/tinyurl-gateway typecheck
          - name: Typecheck agents
            if: contains(fromJSON(needs.changes.outputs.ci), '@gdgjp/agents')
            run: pnpm --filter @gdgjp/agents typecheck
          - name: Typecheck go extension
            if: contains(fromJSON(needs.changes.outputs.ci), '@gdgjp/go-extension')
            run: pnpm --filter @gdgjp/go-extension typecheck
          - name: Typecheck langfuse forwarder
            if: contains(fromJSON(needs.changes.outputs.ci), '@gdgjp/langfuse-forwarder')
            run: pnpm --filter @gdgjp/langfuse-forwarder typecheck

  test:
    name: Unit tests
    needs: changes
    if: needs.changes.outputs.ci != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - parallel:
          - name: Test accounts
            if: contains(fromJSON(needs.changes.outputs.ci), '@gdgjp/accounts')
            run: pnpm --filter @gdgjp/accounts test
          - name: Test tinyurl
            if: contains(fromJSON(needs.changes.outputs.ci), '@gdgjp/tinyurl')
            run: pnpm --filter @gdgjp/tinyurl test
          - name: Test wiki
            if: contains(fromJSON(needs.changes.outputs.ci), '@gdgjp/wiki')
            run: pnpm --filter @gdgjp/wiki test
          - name: Test img
            if: contains(fromJSON(needs.changes.outputs.ci), '@gdgjp/img')
            run: pnpm --filter @gdgjp/img test
          - name: Test scheduler
            if: contains(fromJSON(needs.changes.outputs.ci), '@gdgjp/scheduler')
            run: pnpm --filter @gdgjp/scheduler test
          - name: Test SNS
            if: contains(fromJSON(needs.changes.outputs.ci), '@gdgjp/sns')
            run: pnpm --filter @gdgjp/sns test
          - name: Test pay
            if: contains(fromJSON(needs.changes.outputs.ci), '@gdgjp/pay')
            run: pnpm --filter @gdgjp/pay test
          - name: Test ost
            if: contains(fromJSON(needs.changes.outputs.ci), '@gdgjp/ost')
            run: pnpm --filter @gdgjp/ost test
          - name: Test discord-relay
            if: contains(fromJSON(needs.changes.outputs.ci), '@gdgjp/discord-relay')
            run: pnpm --filter @gdgjp/discord-relay test
          - name: Test website
            if: contains(fromJSON(needs.changes.outputs.ci), '@gdgjp/website')
            run: pnpm --filter @gdgjp/website test
          - name: Test gdg-lib
            if: contains(fromJSON(needs.changes.outputs.ci), '@gdgjp/gdg-lib')
            run: pnpm --filter @gdgjp/gdg-lib test
          - name: Test tinyurl gateway
            if: contains(fromJSON(needs.changes.outputs.ci), '@gdgjp/tinyurl-gateway')
            run: pnpm --filter @gdgjp/tinyurl-gateway test
          - name: Test agents
            if: contains(fromJSON(needs.changes.outputs.ci), '@gdgjp/agents')
            run: pnpm --filter @gdgjp/agents test
          - name: Test go extension
            if: contains(fromJSON(needs.changes.outputs.ci), '@gdgjp/go-extension')
            run: pnpm --filter @gdgjp/go-extension test
          - name: Test langfuse forwarder
            if: contains(fromJSON(needs.changes.outputs.ci), '@gdgjp/langfuse-forwarder')
            run: pnpm --filter @gdgjp/langfuse-forwarder test

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.build != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - parallel:
          - name: Build accounts
            if: contains(fromJSON(needs.changes.outputs.build), '@gdgjp/accounts')
            run: pnpm --filter @gdgjp/accounts build
          - name: Build tinyurl
            if: contains(fromJSON(needs.changes.outputs.build), '@gdgjp/tinyurl')
            run: pnpm --filter @gdgjp/tinyurl build
          - name: Build wiki
            if: contains(fromJSON(needs.changes.outputs.build), '@gdgjp/wiki')
            run: pnpm --filter @gdgjp/wiki build
          - name: Build img
            if: contains(fromJSON(needs.changes.outputs.build), '@gdgjp/img')
            run: pnpm --filter @gdgjp/img build
          - name: Build scheduler
            if: contains(fromJSON(needs.changes.outputs.build), '@gdgjp/scheduler')
            run: pnpm --filter @gdgjp/scheduler build
          - name: Build SNS
            if: contains(fromJSON(needs.changes.outputs.build), '@gdgjp/sns')
            run: pnpm --filter @gdgjp/sns build
          - name: Build pay
            if: contains(fromJSON(needs.changes.outputs.build), '@gdgjp/pay')
            run: pnpm --filter @gdgjp/pay build
          - name: Build ost
            if: contains(fromJSON(needs.changes.outputs.build), '@gdgjp/ost')
            run: pnpm --filter @gdgjp/ost build
          - name: Build discord-relay
            if: contains(fromJSON(needs.changes.outputs.build), '@gdgjp/discord-relay')
            run: pnpm --filter @gdgjp/discord-relay build
          - name: Build website
            if: contains(fromJSON(needs.changes.outputs.build), '@gdgjp/website')
            run: pnpm --filter @gdgjp/website build
          - name: Build tinyurl gateway
            if: contains(fromJSON(needs.changes.outputs.build), '@gdgjp/tinyurl-gateway')
            run: pnpm --filter @gdgjp/tinyurl-gateway build
          - name: Build agents
            if: contains(fromJSON(needs.changes.outputs.build), '@gdgjp/agents')
            run: pnpm --filter @gdgjp/agents build
          - name: Build go extension
            if: contains(fromJSON(needs.changes.outputs.build), '@gdgjp/go-extension')
            run: |
              pnpm --filter @gdgjp/go-extension build
              unzip -t go-extension/dist/gdg-japan-go-links.zip
      - name: Upload go extension package
        if: contains(fromJSON(needs.changes.outputs.build), '@gdgjp/go-extension')
        uses: actions/upload-artifact@v4
        with:
          name: gdg-japan-go-links
          path: go-extension/dist/gdg-japan-go-links.zip
          retention-days: 14

  e2e:
    name: E2E (${{ matrix.app }})
    needs: changes
    if: needs.changes.outputs.e2e != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # wiki's inherited e2e suite (tests/e2e/access-control.spec.ts) seeds
        # users directly into the local miniflare D1 sqlite file, which
        # @cloudflare/vite-plugin only creates lazily on first query. The
        # wiki app's loaders short-circuit for anonymous requests before
        # touching D1, so the sqlite file is never created during CI's
        # webServer warmup and global-setup throws. Tracked as a follow-up:
        # rewrite global-setup to migrate-then-seed via better-sqlite3 at a
        # deterministic path. Page-access logic is still covered by the
        # vitest unit suite (Unit tests (wiki)) in the meantime.
        app: ${{ fromJSON(needs.changes.outputs.e2e) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create accounts dev vars
        run: |
          cat > accounts/.dev.vars <<EOF
          BETTER_AUTH_SECRET=ci-better-auth-secret-for-e2e-tests
          E2E_TEST_MODE=true
          TINYURL_CLIENT_ID=tinyurl
          TINYURL_CLIENT_SECRET=ci-idp-client-secret
          IMG_CLIENT_ID=img
          IMG_CLIENT_SECRET=ci-idp-client-secret
          SCHEDULER_CLIENT_ID=scheduler
          SCHEDULER_CLIENT_SECRET=ci-idp-client-secret
          WIKI_CLIENT_ID=wiki
          WIKI_CLIENT_SECRET=ci-idp-client-secret
          APP_URL=http://localhost:5173
          TINYURL_REDIRECT_URLS=http://localhost:5174/api/auth/callback/gdgjp
          IMG_REDIRECT_URLS=http://localhost:5175/api/auth/callback/gdgjp
          SCHEDULER_REDIRECT_URLS=http://localhost:5176/api/auth/callback/gdgjp
          WIKI_REDIRECT_URLS=http://localhost:5177/api/auth/callback/gdgjp
          EOF

          cat > tinyurl/.dev.vars <<EOF
          RP_SESSION_SECRET=ci-rp-session-secret
          IDP_CLIENT_SECRET=ci-idp-client-secret
          APP_URL=http://localhost:5174
          ACCOUNTS_URL=http://localhost:5173
          IDP_URL=http://localhost:5173
          IDP_CLIENT_ID=tinyurl
          SHORT_URL_BASE=http://localhost:5174
          EOF

          cat > img/.dev.vars <<EOF
          RP_SESSION_SECRET=ci-better-auth-secret
          IDP_CLIENT_SECRET=ci-idp-client-secret
          INTERNAL_API_SECRET=ci-internal-api-secret
          APP_URL=http://localhost:5175
          ACCOUNTS_URL=http://localhost:5173
          IDP_URL=http://localhost:5173
          IDP_CLIENT_ID=img
          EOF

          cat > scheduler/.dev.vars <<EOF
          RP_SESSION_SECRET=ci-better-auth-secret
          IDP_CLIENT_SECRET=ci-idp-client-secret
          APP_URL=http://localhost:5176
          ACCOUNTS_URL=http://localhost:5173
          IDP_URL=http://localhost:5173
          EOF

          # discord-relay's suite never reaches the IdP: it signs in through
          # /dev/login, which needs ENVIRONMENT to be anything but "production".
          cat > discord-relay/.dev.vars <<EOF
          RP_SESSION_SECRET=ci-rp-session-secret
          IDP_CLIENT_SECRET=ci-idp-client-secret
          APP_URL=http://localhost:5181
          ACCOUNTS_URL=http://localhost:5173
          IDP_URL=http://localhost:5173
          IDP_CLIENT_ID=discord-relay
          ENVIRONMENT=development
          EOF
      - name: Migrate Accounts local database
        run: pnpm --filter @gdgjp/accounts migrate:local
      - name: Migrate img local database
        if: matrix.app == 'img'
        run: pnpm --filter @gdgjp/img migrate:local
      - name: Install Playwright browsers
        run: pnpm --filter @gdgjp/${{ matrix.app }} exec playwright install --with-deps chromium
      - name: Run E2E testing
        run: pnpm --filter @gdgjp/${{ matrix.app }} test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.app }}
          path: "${{ matrix.app }}/playwright-report/"
          retention-days: 7
