name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      engineering: ${{ steps.changes.outputs.engineering }}
      job-lifecycle: ${{ steps.changes.outputs.job-lifecycle }}
      ci: ${{ steps.changes.outputs.ci }}
      build: ${{ steps.changes.outputs.build }}
      e2e: ${{ steps.changes.outputs.e2e }}
      lint: ${{ steps.changes.outputs.lint }}
      openapi: ${{ steps.changes.outputs.openapi }}
      script-tests: ${{ steps.changes.outputs.script-tests }}
      cli: ${{ steps.changes.outputs.cli }}
      design-source: ${{ steps.changes.outputs.design-source }}
      full: ${{ steps.changes.outputs.full }}
      base: ${{ steps.changes.outputs.base }}
      head: ${{ steps.changes.outputs.head }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Initialize only the public UI dependency in jobs that install packages.
          submodules: false
      - name: Detect affected workspaces
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/changed-workspaces.mjs --base "$BASE_SHA" --head "$HEAD_SHA"

  code-comments:
    name: Repository policy
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - name: Initialize shared UI submodule
        run: git submodule update --init packages/design-system
      - name: Initialize Playbook submodule
        run: git submodule update --init skills
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check documentation layout and links
        run: node scripts/check-docs.mjs
      - name: Check workspace import boundaries
        run: node scripts/check-workspace-boundaries.mjs
      - name: Reject new code comments
        env:
          BASE_SHA: ${{ needs.changes.outputs.base }}
          HEAD_SHA: ${{ needs.changes.outputs.head }}
        run: node scripts/check-code-comments.mjs --diff "$BASE_SHA" "$HEAD_SHA"

  engineering:
    name: Engineering checks
    needs: changes
    if: needs.changes.outputs.engineering == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Initialize shared UI submodule
        run: git submodule update --init packages/design-system
      - name: Initialize Playbook submodule
        run: git submodule update --init skills
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck:node-scripts
      - run: node scripts/pstack.mjs doctor
      - run: node .agents/skills/verify-acl-boundaries/scripts/verify.mjs --mutation-proof

  job-lifecycle:
    name: Runner lifecycle verification
    needs: changes
    if: needs.changes.outputs.job-lifecycle == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - name: Initialize shared UI submodule
        run: git submodule update --init packages/design-system
      - name: Initialize Playbook submodule
        run: git submodule update --init skills
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: pnpm install --frozen-lockfile
      - run: |
          node --test .agents/skills/verify-job-lifecycle/scripts/verify.test.mjs
          node .agents/skills/verify-job-lifecycle/scripts/verify.mjs --mutation-proof
      - name: Upload lifecycle verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-lifecycle-verification
          path: local_data/pstack/job-lifecycle/
          if-no-files-found: warn
          retention-days: 7

  lint:
    name: Lint (Biome)
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - name: Initialize shared UI submodule
        run: git submodule update --init packages/design-system
      - name: Initialize Playbook submodule
        run: git submodule update --init skills
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint affected files
        env:
          BASE_SHA: ${{ needs.changes.outputs.base }}
          HEAD_SHA: ${{ needs.changes.outputs.head }}
          FULL_CHECK: ${{ needs.changes.outputs.full }}
        run: |
          if [[ "$FULL_CHECK" == "true" ]]; then
            pnpm lint
            exit
          fi
          mapfile -d '' files < <(git diff --diff-filter=ACMRTUXB --name-only -z --no-renames "$BASE_SHA" "$HEAD_SHA")
          if (( ${#files[@]} == 0 )); then
            exit
          fi
          pnpm exec biome check --files-ignore-unknown=true --no-errors-on-unmatched -- "${files[@]}"

  script-tests:
    name: Workflow script tests
    needs: changes
    if: needs.changes.outputs.script-tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Initialize shared UI submodule
        run: git submodule update --init packages/design-system
      - name: Initialize Playbook submodule
        run: git submodule update --init skills
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: pnpm install --frozen-lockfile
      - run: go build -C apps/cli -o /tmp/gdg-ci ./cmd/gdg
      - run: node --test .github/scripts/*.test.mjs
        env:
          GDG_BIN: /tmp/gdg-ci

  openapi:
    name: OpenAPI contracts
    needs: changes
    if: needs.changes.outputs.openapi == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Initialize shared UI submodule
        run: git submodule update --init packages/design-system
      - name: Initialize Playbook submodule
        run: git submodule update --init skills
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: pnpm install --frozen-lockfile
      - run: pnpm openapi:check

  cli:
    name: CLI (Go)
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Initialize shared UI submodule
        run: git submodule update --init packages/design-system
      - name: Initialize Playbook submodule
        run: git submodule update --init skills
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: pnpm install --frozen-lockfile
      - name: gofmt, vet, test, and build
        working-directory: apps/cli
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            printf 'Files requiring gofmt:\n%s\n' "$unformatted" >&2
            exit 1
          fi
          go vet ./...
          go test ./...
          go build ./...
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            OS="${target%/*}"
            ARCH="${target#*/}"
            GOOS="$OS" GOARCH="$ARCH" go build -o /dev/null ./cmd/gdg
          done

  design-harness:
    name: Design harness
    needs: changes
    if: >-
      contains(fromJSON(needs.changes.outputs.ci), '@gdgjp/design-system') ||
      needs.changes.outputs.design-source == 'true'
    # Playwright 1.59 cannot install Chromium on ubuntu-26.04 (ubuntu-latest since 2026-11).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - name: Initialize shared UI submodule
        run: git submodule update --init packages/design-system
      - name: Initialize Playbook submodule
        run: git submodule update --init skills
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Existing app code predates the harness; only files this change touches must pass.
      - name: Check changed app sources
        if: needs.changes.outputs.design-source == 'true' && needs.changes.outputs.base != ''
        env:
          BASE_SHA: ${{ needs.changes.outputs.base }}
          HEAD_SHA: ${{ needs.changes.outputs.head }}
        run: node scripts/check-design-harness.mjs source --diff "$BASE_SHA" "$HEAD_SHA"
      # The scenario specs' Playwright config also serves the library consumer build.
      - name: Build library consumer
        if: contains(fromJSON(needs.changes.outputs.ci), '@gdgjp/design-system')
        run: pnpm exec turbo test:consumer --filter=@gdgjp/design-system --output-logs=errors-only
      # See the e2e job: the fonts come from a cache instead of --with-deps's apt-get install.
      - name: Install Playwright fonts
        if: contains(fromJSON(needs.changes.outputs.ci), '@gdgjp/design-system')
        uses: ./.github/actions/playwright-fonts
      - name: Install Playwright browsers
        if: contains(fromJSON(needs.changes.outputs.ci), '@gdgjp/design-system')
        run: pnpm --filter @gdgjp/design-system exec playwright install chromium
      - name: Check design system scenarios
        if: contains(fromJSON(needs.changes.outputs.ci), '@gdgjp/design-system')
        run: node scripts/check-design-harness.mjs scenarios
      - name: Upload design reports
        if: always() && contains(fromJSON(needs.changes.outputs.ci), '@gdgjp/design-system')
        uses: actions/upload-artifact@v4
        with:
          name: design-harness-reports
          path: packages/design-system/test-results/design/
          if-no-files-found: ignore
          retention-days: 7

  typecheck:
    name: Typecheck
    needs: changes
    if: needs.changes.outputs.ci != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Initialize shared UI submodule
        run: git submodule update --init packages/design-system
      - name: Initialize Playbook submodule
        run: git submodule update --init skills
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Application typechecks run in isolated clean jobs. Build the workspace
      # package that their package.json exports point at before Vite resolves it.
      - name: Build shared UI dependency
        run: pnpm --filter @gdgjp/design-system build
      - name: Create accounts typecheck vars
        if: contains(fromJSON(needs.changes.outputs.ci), '@gdgjp/accounts')
        run: cp apps/accounts/.dev.vars.example apps/accounts/.dev.vars
      - name: Run affected typecheck
        env:
          WORKSPACES: ${{ needs.changes.outputs.ci }}
        run: node .github/scripts/run-affected.mjs typecheck
  test:
    name: Unit tests
    needs: changes
    if: needs.changes.outputs.ci != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Initialize shared UI submodule
        run: git submodule update --init packages/design-system
      - name: Initialize Playbook submodule
        run: git submodule update --init skills
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Vitest also resolves the package's generated export entrypoints.
      - name: Build shared UI dependency
        run: pnpm --filter @gdgjp/design-system build
      - name: Run affected test
        env:
          WORKSPACES: ${{ needs.changes.outputs.ci }}
        run: node .github/scripts/run-affected.mjs test
  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.build != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Initialize shared UI submodule
        run: git submodule update --init packages/design-system
      - name: Initialize Playbook submodule
        run: git submodule update --init skills
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build shared UI dependency
        run: pnpm --filter @gdgjp/design-system build
      - name: Run affected build
        env:
          WORKSPACES: ${{ needs.changes.outputs.build }}
        run: node .github/scripts/run-affected.mjs build
      - name: Build GDG UI consumer
        if: contains(fromJSON(needs.changes.outputs.build), '@gdgjp/design-system')
        run: pnpm --filter @gdgjp/design-system test:consumer
      - name: Validate go extension package
        if: contains(fromJSON(needs.changes.outputs.build), '@gdgjp/go-extension')
        run: unzip -t apps/go-extension/dist/gdg-japan-go-links.zip
      - name: Upload go extension package
        if: contains(fromJSON(needs.changes.outputs.build), '@gdgjp/go-extension')
        uses: actions/upload-artifact@v4
        with:
          name: gdg-japan-go-links
          path: apps/go-extension/dist/gdg-japan-go-links.zip
          retention-days: 14

  e2e:
    name: E2E (${{ matrix.app }})
    needs: changes
    if: needs.changes.outputs.e2e != '[]'
    # Playwright 1.59 cannot install Chromium on ubuntu-26.04 (ubuntu-latest since 2026-11).
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.e2e) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Initialize shared UI submodule
        run: git submodule update --init packages/design-system
      - name: Initialize Playbook submodule
        run: git submodule update --init skills
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright fonts
        if: matrix.app == 'design-system' || matrix.app == 'pr'
        uses: ./.github/actions/playwright-fonts
      - name: Install Playwright browsers
        run: pnpm --filter @gdgjp/${{ matrix.app }} exec playwright install chromium
      - name: Run E2E testing
        run: pnpm test:e2e --workspace @gdgjp/${{ matrix.app }}
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.app }}
          path: local_data/pstack/e2e/
          retention-days: 7

  required:
    name: Required checks
    needs: [changes, code-comments, engineering, job-lifecycle, lint, script-tests, openapi, cli, design-harness, typecheck, test, build, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected check to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$RESULTS"

  observations:
    name: Engineering observations
    needs: [changes, code-comments, engineering, job-lifecycle, lint, script-tests, openapi, cli, design-harness, typecheck, test, build, e2e]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Collect deployment attempts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p local_data/pstack/engineering-health
          since=$(date -u -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)
          if ! gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs?created=>=${since}&per_page=100" > local_data/pstack/engineering-health/deploy-pages.json; then
            printf '%s\n' '{"status":"unavailable","reason":"GitHub deployment history collection failed"}' > local_data/pstack/engineering-health/deploy-collection.json
            exit 1
          fi
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const directory = "local_data/pstack/engineering-health";
          const pages = JSON.parse(readFileSync(`${directory}/deploy-pages.json`, "utf8"));
          if (!Array.isArray(pages) || pages.length === 0 || pages.some(page => !Array.isArray(page.workflow_runs))) {
            throw new Error("Deployment history pages are malformed");
          }
          const workflow_runs = pages.flatMap(page => page.workflow_runs);
          const total_count = pages[0].total_count;
          const complete = Number.isSafeInteger(total_count) && total_count >= 0
            && pages.every(page => page.total_count === total_count)
            && workflow_runs.length === total_count
            && new Set(workflow_runs.map(run => run.id)).size === workflow_runs.length;
          writeFileSync(`${directory}/deploy-runs.json`, JSON.stringify({
            collectedAt: new Date().toISOString(),
            source: `github-api:${process.env.GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs`,
            workflow_runs, total_count, complete,
          }, null, 2));
          NODE
      - name: Record engineering observations
        if: always()
        run: |
          since=$(date -u -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)
          set --
          if test -f local_data/pstack/engineering-health/deploy-runs.json; then
            set -- --deploy-runs local_data/pstack/engineering-health/deploy-runs.json
          fi
          node scripts/engineering-health.mjs --since "$since" "$@" --output local_data/pstack/engineering-health/hosted.json
      - name: Upload engineering observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engineering-observations
          path: local_data/pstack/engineering-health/
          if-no-files-found: warn
          retention-days: 14
