name: Codex review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

env:
  NODE_VERSION: "22"
  CODEX_VERSION: "0.171.0"

jobs:
  plan:
    name: Plan
    if: >-
      github.event.sender.type != 'Bot'
      && (github.event.pull_request == null
        || github.event.pull_request.head.repo.full_name == github.repository)
      && (github.event_name != 'pull_request'
        || github.event.action != 'labeled'
        || github.event.label.name == 'E-code-review')
      && (github.event_name != 'issue_comment'
        || (github.event.issue.pull_request
          && (contains(github.event.comment.body, '/codex')
            || contains(github.event.comment.body, '@github-actions'))))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
      statuses: write
    outputs:
      numbers: ${{ steps.plan.outputs.numbers }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/codex-review.mjs plan

  agent:
    name: Agent
    needs: plan
    if: needs.plan.outputs.numbers != ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: codex-auth
      cancel-in-progress: false
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Codex
        run: npm install --global "@openai/codex@${CODEX_VERSION}"
      - name: Allow the Codex sandbox to create user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Restore Codex login
        id: restore
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CODEX_AUTH_KEY: ${{ secrets.CODEX_AUTH_KEY }}
        run: |
          echo "CODEX_HOME=$RUNNER_TEMP/codex-home" >> "$GITHUB_ENV"
          node .github/scripts/codex-auth.mjs restore "$RUNNER_TEMP/codex-home"
      - name: Run Codex agent
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CODEX_MODEL: ${{ vars.CODEX_REVIEW_MODEL || 'gpt-6.2-astra' }}
          CODEX_EFFORT: ${{ vars.CODEX_REVIEW_EFFORT || 'medium' }}
          NUMBERS: ${{ needs.plan.outputs.numbers }}
        run: node .github/scripts/codex-review.mjs agent "$NUMBERS"
      - name: Prepare refreshed Codex login
        id: save
        if: always() && steps.restore.outcome == 'success'
        env:
          CODEX_AUTH_KEY: ${{ secrets.CODEX_AUTH_KEY }}
        run: node .github/scripts/codex-auth.mjs save "$CODEX_HOME" "$RUNNER_TEMP/codex-auth-upload"
      - name: Store refreshed Codex login
        if: always() && steps.save.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: codex-auth
          path: ${{ runner.temp }}/codex-auth-upload/codex-auth.enc
          retention-days: 90
          if-no-files-found: error
      - name: Delete older Codex logins
        if: always() && steps.save.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/codex-auth.mjs prune
